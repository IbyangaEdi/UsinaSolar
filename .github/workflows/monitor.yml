name: Atualiza painel solar

on:
  schedule:
    - cron: "*/30 9-22 * * *"
  workflow_dispatch: {}

concurrency:
  group: dashboard-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Checa geracao e envia alerta por e-mail se necessario
        env:
          SEMS_ACCOUNT: ${{ secrets.SEMS_ACCOUNT }}
          SEMS_PASSWORD: ${{ secrets.SEMS_PASSWORD }}
          ZOHO_SMTP_HOST: ${{ secrets.ZOHO_SMTP_HOST }}
          ZOHO_SMTP_PORT: ${{ secrets.ZOHO_SMTP_PORT }}
          ZOHO_USER: ${{ secrets.ZOHO_USER }}
          ZOHO_PASSWORD: ${{ secrets.ZOHO_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python3 scripts/check_goodwe.py

      - name: Gera o painel (index.html)
        env:
          SEMS_ACCOUNT: ${{ secrets.SEMS_ACCOUNT }}
          SEMS_PASSWORD: ${{ secrets.SEMS_PASSWORD }}
          PUBLIC_DISPLAY_NAME: ${{ secrets.PUBLIC_DISPLAY_NAME }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: python3 scripts/generate_dashboard.py

      - name: Publica mudancas no repositorio
        run: |
          git config user.name "goodwe-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A index.html data/
          if git diff --staged --quiet; then
            echo "Nada para commitar"
          else
            git commit -m "Atualiza painel solar [skip ci]"
            git push
          fi
